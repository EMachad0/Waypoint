min_version = "2025.1.0"

[settings]
experimental = true

[tools]
# Rust is pinned via rust-toolchain.toml (rustup), not mise, so bare `cargo` and CI agree on one
# toolchain.
just = "latest"
github-cli = "latest"
# bacon, the background checker the zellij dev layout runs as `bacon clippy-all`. Not in mise's
# registry, and its GitHub releases carry no macos-arm64 asset, so the cargo backend is the only
# one that resolves on every platform the team uses.
"cargo:bacon" = "latest"
# worktrunk, the git worktree manager the `wk` just module wraps. The release archive's binary is
# named `wt`, not the repo name `worktrunk`, so the github backend needs `exe` to put `wt` on PATH.
# Pinned to an explicit tag rather than "latest" because worktrunk's binary self-reports a version
# (0.34.x) decoupled from its release tags, and mise derives the locked version from the binary, so
# "latest" resolves to a stale release. Bump this tag to upgrade.
"github:max-sixty/worktrunk" = { version = "0.61.0", exe = "wt" }

[env]

[hooks]
enter = [
    "mise install --locked --quiet",
]
